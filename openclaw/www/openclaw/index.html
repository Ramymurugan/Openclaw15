<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10a37f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/assets/openclaw/manifest.json">
    <title>OpenClaw AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile Outer Frame */
        .openclaw-mobile-frame {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        @media (min-width: 520px) {
            .openclaw-mobile-frame {
                height: 92vh;
                border-radius: 28px;
                border: 4px solid #1e293b;
            }
        }

        /* ChatGPT Header */
        .openclaw-header {
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .header-btn {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #334155;
            transition: background 0.15s;
        }

        .header-btn:active {
            background: #f1f5f9;
        }

        .header-btn svg {
            width: 22px;
            height: 22px;
            stroke: #334155;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Backdrop Overlay for Sidebar */
        .openclaw-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .openclaw-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ChatGPT Android Sidebar Drawer */
        .openclaw-sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 82%;
            max-width: 320px;
            background: #171717;
            color: #ececf1;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 6px 0 25px rgba(0, 0, 0, 0.3);
        }

        .openclaw-sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2d2d2d;
        }

        #new-chat-btn {
            width: 100%;
            height: 44px;
            background: #202123;
            border: 1px solid #4d4d4f;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 14px;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        #new-chat-btn:active {
            background: #343541;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }

        .history-item {
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 8px;
            font-size: 14px;
            color: #c5c5d2;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .history-item:active, .history-item.active {
            background: #343541;
            color: #ffffff;
            font-weight: 600;
        }

        .history-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #2d2d2d;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #ececf1;
            background: #171717;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #10a37f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        /* Chat Scroll Feed */
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #ffffff;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .msg-row.bot {
            justify-content: flex-start;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .msg-bubble {
            background: #10a37f;
            color: #ffffff;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 2px 8px rgba(16, 163, 127, 0.2);
        }

        .bot .msg-bubble {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            border-radius: 18px 18px 18px 4px;
        }

        .thinking-dots {
            font-style: italic;
            color: #64748b;
        }

        /* Voice Wave Visualizer */
        .voice-wave {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            background: #f0fdf4;
            border-top: 1px solid #bbf7d0;
        }

        .voice-wave.active {
            display: flex;
        }

        .wave-text {
            font-size: 12.5px;
            color: #166534;
            font-weight: 600;
            margin-right: 6px;
        }

        .wave-bar {
            width: 3.5px;
            height: 14px;
            background: #16a34a;
            border-radius: 2px;
            animation: waveAnim 0.7s infinite alternate ease-in-out;
        }

        .wb1 { animation-delay: 0.1s; }
        .wb2 { animation-delay: 0.3s; }
        .wb3 { animation-delay: 0.5s; }
        .wb4 { animation-delay: 0.2s; }

        @keyframes waveAnim {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        /* Input Control Bar */
        .input-bar {
            padding: 12px 14px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            height: 44px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            padding: 0 16px;
            font-size: 14.5px;
            color: #0f172a;
            outline: none;
            transition: border 0.15s, background 0.15s;
        }

        .chat-input:focus {
            background: #ffffff;
            border-color: #10a37f;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: scale(0.94);
        }

        .mic-btn {
            background: #f1f5f9;
            color: #64748b;
        }

        .mic-btn.listening {
            background: #fee2e2;
            color: #ef4444;
        }

        .send-btn {
            background: #10a37f;
            color: #ffffff;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
        }
    </style>
    <!-- csrf_token -->
</head>
<body>

<div class="openclaw-mobile-frame">
    <!-- Overlay Backdrop for Sidebar -->
    <div class="openclaw-overlay" id="openclaw-overlay"></div>

    <!-- ChatGPT Mobile Off-Canvas Sidebar -->
    <div class="openclaw-sidebar" id="openclaw-sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>
        </div>

        <div class="history-list" id="history-list">
            <!-- Sessions rendered here -->
        </div>

        <div class="sidebar-footer">
            <div class="user-avatar">A</div>
            <span>Administrator</span>
        </div>
    </div>

    <!-- Top Header -->
    <div class="openclaw-header">
        <button class="header-btn" id="menu-btn" title="Open Sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="header-title">
            🤖 OpenClaw
        </div>

        <button class="header-btn" id="header-new-btn" title="New Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>

    <!-- Messages Container -->
    <div class="chat-feed" id="chat-feed">
        <!-- Message bubbles -->
    </div>

    <!-- Voice Wave visualizer -->
    <div class="voice-wave" id="voice-wave">
        <span class="wave-text">Listening...</span>
        <div class="wave-bar wb1"></div>
        <div class="wave-bar wb2"></div>
        <div class="wave-bar wb3"></div>
        <div class="wave-bar wb4"></div>
    </div>

    <!-- Bottom Input Bar -->
    <div class="input-bar">
        <button class="action-btn mic-btn" id="mic-btn" title="Voice Input">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>

        <input type="text" class="chat-input" id="chat-input" placeholder="Message OpenClaw..." autocomplete="off">

        <button class="action-btn send-btn" id="send-btn" title="Send Question">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
    let chat_sessions = [];
    let current_session_id = null;
    let chat_history = [];

    const sidebar = document.getElementById("openclaw-sidebar");
    const overlay = document.getElementById("openclaw-overlay");
    const menuBtn = document.getElementById("menu-btn");
    const headerNewBtn = document.getElementById("header-new-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const historyList = document.getElementById("history-list");
    const chatFeed = document.getElementById("chat-feed");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const voiceWave = document.getElementById("voice-wave");

    function openSidebar() {
        sidebar.classList.add("open");
        overlay.classList.add("active");
    }

    function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("active");
    }

    menuBtn.addEventListener("click", openSidebar);
    overlay.addEventListener("click", closeSidebar);

    async function fetchAPI(method, args = {}) {
        if (window.frappe && window.frappe.call) {
            return new Promise((resolve) => {
                frappe.call({
                    method: method,
                    args: args,
                    callback: (r) => resolve(r.message)
                });
            });
        }

        const query = new URLSearchParams(args).toString();
        const url = `/api/method/${method}?${query}`;
        const res = await fetch(url, {
            method: "GET",
            headers: { "Accept": "application/json" }
        });
        const data = await res.json();
        return data.message;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function addMessage(sender, message, type = "bot") {
        if (!message || !message.trim()) return;

        const row = document.createElement("div");
        row.className = `msg-row ${type}`;

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = escapeHtml(message.trim());

        row.appendChild(bubble);
        chatFeed.appendChild(row);
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function renderSidebar() {
        historyList.innerHTML = "";
        chat_sessions.forEach(session => {
            const activeClass = session.id === current_session_id ? "active" : "";
            const item = document.createElement("div");
            item.className = `history-item ${activeClass}`;
            item.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <div class="history-item-title">${escapeHtml(session.title)}</div>
            `;
            item.addEventListener("click", () => {
                loadSession(session.id);
                closeSidebar();
            });
            historyList.appendChild(item);
        });
    }

    async function loadSession(id) {
        current_session_id = id;
        chatFeed.innerHTML = "";
        const msgs = await fetchAPI("openclaw.api.get_messages", { session_id: id });
        chat_history = msgs || [];
        if (chat_history.length > 0) {
            chat_history.forEach(msg => {
                const type = msg.sender === "You" ? "user" : "bot";
                addMessage(msg.sender, msg.message, type);
            });
        } else {
            addMessage("OpenClaw", "Hello! How can I help you?", "bot");
        }
        renderSidebar();
    }

    async function startNewChat() {
        if (chat_history.length === 0 && current_session_id) {
            chatFeed.innerHTML = "";
            addMessage("OpenClaw", "Hello! How can I help you?", "bot");
            closeSidebar();
            return;
        }

        const newId = await fetchAPI("openclaw.api.create_session", { title: "New Chat" });
        if (newId) {
            current_session_id = newId;
            chat_sessions.unshift({ id: newId, title: "New Chat" });
            loadSession(newId);
        }
        closeSidebar();
    }

    newChatBtn.addEventListener("click", startNewChat);
    headerNewBtn.addEventListener("click", startNewChat);

    async function sendQuestion() {
        const question = chatInput.value.trim();
        if (!question) return;

        if (!current_session_id) {
            const newId = await fetchAPI("openclaw.api.create_session", { title: "New Chat" });
            if (newId) {
                current_session_id = newId;
                chat_sessions.unshift({ id: newId, title: "New Chat" });
            }
        }

        addMessage("You", question, "user");
        chatInput.value = "";

        // Thinking Indicator
        const thinkRow = document.createElement("div");
        thinkRow.className = "msg-row bot";
        thinkRow.id = "thinking-indicator";
        thinkRow.innerHTML = '<div class="msg-bubble thinking-dots">Thinking...</div>';
        chatFeed.appendChild(thinkRow);
        chatFeed.scrollTop = chatFeed.scrollHeight;

        try {
            const res = await fetchAPI("openclaw.api.ask", {
                question: question,
                session_id: current_session_id
            });

            const indicator = document.getElementById("thinking-indicator");
            if (indicator) indicator.remove();

            let answer = null;
            if (res) {
                answer = typeof res === "string" ? res : (res.answer || res.message);
            }
            if (!answer) {
                answer = "Sorry, I could not understand the response.";
            }

            addMessage("OpenClaw", answer, "bot");

            // Auto-rename session on first message
            if (chat_history.length <= 1) {
                const title = question.substring(0, 25) + (question.length > 25 ? "..." : "");
                fetchAPI("openclaw.api.rename_session", { session_id: current_session_id, title: title });
                const sess = chat_sessions.find(s => s.id === current_session_id);
                if (sess) sess.title = title;
                renderSidebar();
            }

        } catch (err) {
            console.error(err);
            const indicator = document.getElementById("thinking-indicator");
            if (indicator) indicator.remove();
            addMessage("OpenClaw", "Sorry, something went wrong.", "bot");
        }
    }

    sendBtn.addEventListener("click", sendQuestion);
    chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendQuestion();
    });

    // Voice recognition
    micBtn.addEventListener("click", () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Voice input is not supported in this browser.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.interimResults = false;
        recognition.continuous = false;

        micBtn.classList.add("listening");
        voiceWave.classList.add("active");

        recognition.start();

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            chatInput.value = text;
            sendQuestion();
        };

        recognition.onerror = () => {
            micBtn.classList.remove("listening");
            voiceWave.classList.remove("active");
        };

        recognition.onend = () => {
            micBtn.classList.remove("listening");
            voiceWave.classList.remove("active");
        };
    });

    async function init() {
        const sessions = await fetchAPI("openclaw.api.get_sessions");
        if (sessions && sessions.length > 0) {
            chat_sessions = sessions;
            loadSession(chat_sessions[0].id);
        } else {
            startNewChat();
        }
    }

    init();
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register(
            "/openclaw/service-worker.js",
            { scope: "/openclaw/" }
        );
    });
}
</script>
</body>
</html>
